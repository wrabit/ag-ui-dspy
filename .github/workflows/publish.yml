name: publish
# Publishes to PyPI through trusted publishing when a v* tag is pushed.
# One-time setup on pypi.org: Your projects -> Publishing -> add a pending
# publisher with owner wrabit, repository ag-ui-dspy, workflow publish.yml,
# environment pypi. No API token is stored anywhere.
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
